<body><div id="app"></div><script>
const strings={es:{nav:['Inicio','Investigación','Tecnología','Equipo','Innovación','Contacto'],eyebrow:'INVESTIGACIÓN · FORMACIÓN · INNOVACIÓN',hero:'Exploramos el movimiento humano desde la ciencia, la tecnología y la innovación.',sub:'Investigación interdisciplinaria para comprender el movimiento en sus dimensiones motoras, cognitivas y sociales.',researchButton:'Conoce nuestra investigación',aboutTag:'NUESTRA IDENTIDAD',about:'¿Quiénes somos?',aboutBody:'El Laboratorio de Biomecánica y Desempeño Humano es un espacio académico de investigación, formación e innovación de la Facultad de Medicina y Ciencias de la Salud de la Universidad Central de Chile. Nos dedicamos al estudio del movimiento humano desde una perspectiva integral e interdisciplinaria, considerando sus dimensiones motoras, cognitivas y sociales. Articulamos conocimientos de biomecánica, control motor, neurociencia y disciplinas afines mediante metodologías experimentales, tecnologías de evaluación y análisis avanzado de señales. Promovemos la formación estudiantil, la colaboración interdisciplinaria y la generación de conocimiento y soluciones relevantes para la salud y la sociedad.',pillars:['Investigación científica','Formación de estudiantes','Innovación tecnológica'],identityTag:'PROPÓSITO Y PROYECCIÓN',identityTitle:'Nuestro compromiso',mission:'Misión',missionBody:'Generar, integrar y transferir conocimiento científico sobre el movimiento humano desde una perspectiva interdisciplinaria que considere sus dimensiones motoras, cognitivas y sociales. A través de la investigación rigurosa, la formación de estudiantes y el desarrollo de soluciones tecnológicas innovadoras, buscamos contribuir a la comprensión del control y la adaptación del movimiento y a su aplicación en contextos clínicos, funcionales y de desempeño.',vision:'Visión',visionBody:'Consolidarnos como un laboratorio de referencia nacional, con proyección internacional, en el estudio interdisciplinario del movimiento humano, reconocido por la calidad de su investigación científica, la formación de nuevas generaciones de investigadores y el desarrollo de soluciones tecnológicas innovadoras con impacto en la salud, el desempeño humano y la sociedad.',newsTag:'ACTUALIDAD DEL LABORATORIO',news:'Últimas noticias',newsTitle:'Pronto compartiremos nuestras noticias',newsBody:'Este espacio destacará publicaciones, proyectos, actividades del semillero, congresos y colaboraciones. Las noticias se incorporarán progresivamente y contarán con su propio archivo histórico.',collab:'¿Te interesa colaborar con nosotros?',collabBody:'Conectamos investigación, formación e innovación con nuevas personas e instituciones.',contact:'Contáctanos',footer:'Laboratorio de Biomecánica y Desempeño Humano'},en:{nav:['Home','Research','Technology','Team','Innovation','Contact'],eyebrow:'RESEARCH · EDUCATION · INNOVATION',hero:'Exploring human movement through science, technology and innovation.',sub:'Interdisciplinary research to understand motor, cognitive and social dimensions of human movement.',researchButton:'Explore our research',aboutTag:'OUR IDENTITY',about:'Who we are',aboutBody:'The Human Biomechanics and Performance Laboratory is an academic space for research, education and innovation at the Faculty of Medicine and Health Sciences, Universidad Central de Chile. We study human movement from an integrated, interdisciplinary perspective encompassing its motor, cognitive and social dimensions. We connect biomechanics, motor control, neuroscience and related fields through experimental methods, movement assessment technologies and advanced signal analysis. We promote student training, interdisciplinary collaboration and knowledge and solutions relevant to health and society.',pillars:['Scientific research','Student training','Technology innovation'],identityTag:'PURPOSE AND OUTLOOK',identityTitle:'Our commitment',mission:'Mission',missionBody:'To generate, integrate and transfer scientific knowledge about human movement from an interdisciplinary perspective encompassing its motor, cognitive and social dimensions. Through rigorous research, student education and innovative technological solutions, we seek to advance understanding of movement control and adaptation and their application to clinical, functional and performance contexts.',vision:'Vision',visionBody:'To become a nationally recognized laboratory with international reach in interdisciplinary human movement research, known for the quality of its scientific work, the education of future researchers and innovative technological solutions that benefit health, human performance and society.',newsTag:'LABORATORY UPDATES',news:'Latest news',newsTitle:'News coming soon',newsBody:'This space will feature publications, projects, student research activities, conferences and collaborations. Articles will be added progressively and preserved in a news archive.',collab:'Interested in collaborating?',collabBody:'We connect research, education and innovation with new people and institutions.',contact:'Contact us',footer:'Human Biomechanics and Performance Laboratory'}};
const paths=['index.html','investigacion.html','tecnologia.html','equipo.html','innovacion.html','contacto.html'];let language=localStorage.getItem('lab-language')==='en'?'en':'es';function render(){const t=strings[language];document.documentElement.lang=language;document.querySelector('#app').innerHTML=`<header class="header"><div class="container header-inner"><a href="index.html" class="logo" aria-label="Laboratorio de Biomecánica y Desempeño Humano">Laboratorio de Biomecánica y Desempeño Humano<small>UNIVERSIDAD CENTRAL DE CHILE</small></a><nav class="nav" aria-label="Navigation">${paths.map((p,i)=>`<a href="${p}" ${i===0?'aria-current="page"':''}>${t.nav[i]}</a>`).join('')}</nav><button type="button" class="language" id="toggle">${language.toUpperCase()} / ${language==='es'?'EN':'ES'}</button></div></header><main><section class="home-hero"><div class="container hero-layout"><div><div class="eyebrow">${t.eyebrow}</div><h1>${t.hero}</h1><p>${t.sub}</p><a href="investigacion.html" class="hero-button">${t.researchButton}</a></div><div class="hero-visual" role="img" aria-label="Human movement conceptual illustration"><svg viewBox="0 0 300 300" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="150" cy="150" r="126" stroke="#74E3E5" opacity=".3"/><circle cx="150" cy="150" r="90" stroke="#74E3E5" opacity=".5"/><g stroke="#AAF5F3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><circle cx="151" cy="64" r="22"/><path d="M150 87L148 158L112 201L94 271M148 158L192 204L222 269M150 111L101 142L65 204M150 112L203 140L244 193"/></g><g fill="#73E5E5"><circle cx="148" cy="158" r="6"/><circle cx="112" cy="201" r="6"/><circle cx="192" cy="204" r="6"/><circle cx="101" cy="142" r="6"/><circle cx="203" cy="140" r="6"/></g></svg></div></div></section><section class="section white" id="nosotros"><div class="container"><div class="kicker">${t.aboutTag}</div><h2 class="section-title">${t.about}</h2><p class="section-copy">${t.aboutBody}</p><div class="pillars">${t.pillars.map(p=>`<span class="pillar">${p}</span>`).join('')}</div></div></section><section class="section"><div class="container"><div class="kicker">${t.identityTag}</div><h2 class="section-title">${t.identityTitle}</h2><div class="value-grid"><article class="value-card"><div class="value-icon" aria-hidden="true">◎</div><h3>${t.mission}</h3><p>${t.missionBody}</p></article><article class="value-card"><div class="value-icon" aria-hidden="true">✧</div><h3>${t.vision}</h3><p>${t.visionBody}</p></article></div></div></section><section class="section white" id="noticias"><div class="container"><div class="kicker">${t.newsTag}</div><h2 class="section-title">${t.news}</h2><div class="news-empty"><div class="news-icon" aria-hidden="true">▤</div><div><h3>${t.newsTitle}</h3><p>${t.newsBody}</p></div></div></div></section><section class="section"><div class="container"><div class="callout"><div><h2>${t.collab}</h2><p>${t.collabBody}</p></div><a href="contacto.html">${t.contact}</a></div></div></section></main><footer class="footer"><div class="container footer-inner"><span>© ${new Date().getFullYear()} · Universidad Central de Chile</span><span>${t.footer}</span></div></footer>`;document.querySelector('#toggle').addEventListener('click',()=>{language=language==='es'?'en':'es';localStorage.setItem('lab-language',language);render()})}render();
</script></body></html>
