<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Contacta al Laboratorio de Biomecánica y Desempeño Humano de la Universidad Central de Chile.">
  <title>Contacto | Laboratorio de Biomecánica UCEN</title>
  <link rel="stylesheet" href="paginas.css"><link rel="stylesheet" href="logo.css">
  <style>
    .contact-layout{display:grid;grid-template-columns:.9fr 1.1fr;gap:28px;align-items:start}.contact-info,.contact-form{background:#fff;border:1px solid #d9e6ed;border-radius:19px;padding:34px;box-shadow:0 9px 30px #122f4809}.contact-info h2,.contact-form h2{font-size:23px;margin:0 0 22px}.contact-item{padding:17px 0;border-bottom:1px solid #e5edf2}.contact-item:last-child{border-bottom:0}.contact-item strong{display:block;font-size:14px;margin-bottom:8px}.contact-item a{color:#087e97;font-weight:650;overflow-wrap:anywhere;text-decoration:underline;text-underline-offset:4px}.contact-item p{color:#526e80;line-height:1.6;margin:3px 0}.contact-form label{font-weight:700;display:block;font-size:14px;margin:18px 0 8px}.contact-form input:not([type=checkbox]),.contact-form textarea{display:block;width:100%;border:1px solid #b9cdd9;border-radius:9px;padding:13px 14px;font:inherit;color:#173349;background:#fff}.contact-form textarea{min-height:145px;resize:vertical}.contact-form input:focus,.contact-form textarea:focus{outline:3px solid #70dbe17a;border-color:#0b8c9d}.contact-form button{border:0;background:#0a8295;color:#fff;border-radius:9px;padding:15px 22px;font:inherit;font-weight:800;margin-top:20px;cursor:pointer}.contact-form button:disabled{cursor:wait;opacity:.65}.consent{display:flex;gap:11px;align-items:flex-start;margin-top:20px}.consent label{margin:0;font-weight:400;line-height:1.5;color:#526e80}.consent input{margin-top:4px;flex-shrink:0}.status{margin-top:15px;padding:13px 16px;border-radius:9px;line-height:1.5;display:none}.status.success{display:block;background:#e1f5ec;color:#145b39}.status.error{display:block;background:#fff0ee;color:#96352e}.hint{font-size:13px;line-height:1.5;color:#657e8e;margin:12px 0 0}.honeypot{position:absolute!important;left:-9999px!important;width:1px!important;height:1px!important;overflow:hidden!important}@media(max-width:800px){.contact-layout{grid-template-columns:1fr}.contact-info,.contact-form{padding:25px}}
  </style>
</head>
<body><div id="app"></div>
<script>
  const formEndpoint='https://formspree.io/f/xjywegqd';
  const copy={es:{nav:['Inicio','Investigación','Tecnología','Equipo','Innovación','Contacto'],k:'CONTACTO',title:'Conectemos ciencia y colaboración.',intro:'¿Tienes una propuesta de investigación, colaboración o consulta? Escríbenos a través de nuestros canales.',info:'Información de contacto',lab:'Correo del laboratorio',coord:'Coordinación',instagram:'Instagram',location:'Ubicación',place:'Universidad Central de Chile · Santiago, Chile',form:'Envíanos un mensaje',name:'Nombre',nameHint:'Tu nombre completo',email:'Correo electrónico',emailHint:'nombre@ejemplo.com',subject:'Asunto',subjectHint:'¿En qué podemos ayudarte?',message:'Mensaje',messageHint:'Escribe tu consulta brevemente...',consent:'Acepto que los datos ingresados sean procesados por Formspree para responder esta consulta. No enviaré información clínica ni datos sensibles.',submit:'Enviar mensaje',sending:'Enviando...',ok:'¡Gracias! Tu mensaje fue recibido por el servicio de formularios. Te responderemos a la brevedad.',error:'No pudimos enviar tu mensaje. Inténtalo nuevamente o escríbenos directamente a biomecanica@ucentral.cl.',privacy:'Los datos del formulario se procesan mediante Formspree, un servicio externo.',footer:'Laboratorio de Biomecánica y Desempeño Humano'},en:{nav:['Home','Research','Technology','Team','Innovation','Contact'],k:'CONTACT',title:'Connecting science and collaboration.',intro:'Have a research proposal, collaboration opportunity or question? Reach us through our contact channels.',info:'Contact information',lab:'Laboratory email',coord:'Coordination',instagram:'Instagram',location:'Location',place:'Universidad Central de Chile · Santiago, Chile',form:'Send us a message',name:'Name',nameHint:'Your full name',email:'Email address',emailHint:'name@example.com',subject:'Subject',subjectHint:'How can we help?',message:'Message',messageHint:'Briefly describe your question...',consent:'I agree that the information entered will be processed by Formspree to respond to this inquiry. I will not include clinical or sensitive information.',submit:'Send message',sending:'Sending...',ok:'Thank you! The form service received your message. We will get back to you as soon as possible.',error:'Your message could not be sent. Please try again or email biomecanica@ucentral.cl directly.',privacy:'Form data is processed by Formspree, an external service.',footer:'Human Biomechanics and Performance Laboratory'}};
  const routes=['index.html','investigacion.html','tecnologia.html','equipo.html','innovacion.html','contacto.html'];let language=localStorage.getItem('lab-language')==='en'?'en':'es';
  function render(){const t=copy[language];document.documentElement.lang=language;document.querySelector('#app').innerHTML=`<header class="header"><div class="container header-inner"><a class="logo" href="index.html" aria-label="Laboratorio de Biomecánica y Desempeño Humano">Laboratorio de Biomecánica y Desempeño Humano<small>UNIVERSIDAD CENTRAL DE CHILE</small></a><nav class="nav" aria-label="Navigation">${routes.map((r,i)=>`<a href="${r}" ${i===5?'aria-current="page"':''}>${t.nav[i]}</a>`).join('')}</nav><button class="language" type="button" id="toggle">${language.toUpperCase()} / ${language==='es'?'EN':'ES'}</button></div></header><main><section class="mast"><div class="container"><div class="kicker">${t.k}</div><h1>${t.title}</h1><p>${t.intro}</p></div></section><section class="content"><div class="container contact-layout"><aside class="contact-info"><h2>${t.info}</h2><div class="contact-item"><strong>${t.lab}</strong><a href="mailto:biomecanica@ucentral.cl">biomecanica@ucentral.cl</a></div><div class="contact-item"><strong>${t.coord} · Dr. Arturo González Olguín</strong><a href="mailto:arturo.gonzalez@ucentral.cl">arturo.gonzalez@ucentral.cl</a></div><div class="contact-item"><strong>${t.instagram}</strong><a href="https://www.instagram.com/lab.biomecanica.ucen/" target="_blank" rel="noopener noreferrer">@lab.biomecanica.ucen</a></div><div class="contact-item"><strong>${t.location}</strong><p>${t.place}</p></div></aside><div class="contact-form"><h2>${t.form}</h2><form id="contact-form" action="${formEndpoint}" method="POST"><label for="name">${t.name}</label><input id="name" name="name" type="text" maxlength="100" placeholder="${t.nameHint}" autocomplete="name" required><label for="email">${t.email}</label><input id="email" name="email" type="email" maxlength="160" placeholder="${t.emailHint}" autocomplete="email" required><label for="subject">${t.subject}</label><input id="subject" name="subject" type="text" maxlength="150" placeholder="${t.subjectHint}" required><label for="message">${t.message}</label><textarea id="message" name="message" maxlength="2000" placeholder="${t.messageHint}" required></textarea><div class="honeypot" aria-hidden="true"><label for="website">Website</label><input id="website" type="text" name="_gotcha" tabindex="-1" autocomplete="off"></div><div class="consent"><input type="checkbox" id="consent" required><label for="consent">${t.consent}</label></div><button type="submit" id="submit">${t.submit}</button><div class="status" role="status" aria-live="polite" id="status"></div><p class="hint">${t.privacy}</p></form></div></div></section></main><footer class="footer"><div class="container footer-inner"><span>© ${new Date().getFullYear()} · Universidad Central de Chile</span><span>${t.footer}</span></div></footer>`;document.querySelector('#toggle').onclick=()=>{language=language==='es'?'en':'es';localStorage.setItem('lab-language',language);render()};document.querySelector('#contact-form').addEventListener('submit',submitForm)}
  async function submitForm(event){event.preventDefault();const form=event.currentTarget,button=document.querySelector('#submit'),status=document.querySelector('#status'),t=copy[language];if(!form.reportValidity())return;button.disabled=true;button.textContent=t.sending;status.className='status';status.textContent='';try{const response=await fetch(formEndpoint,{method:'POST',body:new FormData(form),headers:{'Accept':'application/json'}});if(!response.ok)throw new Error('Form submission failed');status.textContent=t.ok;status.className='status success';form.reset()}catch(error){status.textContent=t.error;status.className='status error'}finally{button.disabled=false;button.textContent=t.submit}}
  render();
</script></body></html>
